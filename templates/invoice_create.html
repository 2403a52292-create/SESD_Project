<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Invoice</title><style>body{font:15px Arial;background:#f4f6f4;padding:24px;color:#24352b}.panel{max-width:650px;margin:auto;background:white;padding:24px;border-radius:12px}input,select{display:block;width:100%;padding:11px;margin:10px 0;border:1px solid #ccd5ce;border-radius:7px}button{background:#176b45;color:white;padding:11px 18px;border:0;border-radius:7px}</style></head><body><div class="panel"><a href="{{ url_for('dashboard') }}">← Dashboard</a><h1>Create Invoice / Receipt</h1><form method="post"><label>Customer name</label><input name="customer_name" placeholder="Customer name"><label>Customer contact</label><input name="customer_contact" placeholder="Phone or email"><label>Product / Batch</label><select name="batch_id" required>{% for b in batches %}<option value="{{ b.id }}">{{ b.product_name }} — {{ b.batch_number }} ({{ b.quantity }} available) — ₹{{ '%.2f'|format(b.selling_price) }}</option>{% endfor %}</select><label>Quantity</label><input type="number" name="quantity" min="1" value="1" required><button type="submit">Generate Receipt & Record Sale</button></form></div></body></html>
